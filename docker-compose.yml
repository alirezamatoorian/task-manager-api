

services:
    web:
      build: .
      env_file:
        - .env.docker
      environment:
        RUN_MIGRATIONS: "true"
      volumes:
        - static:/app/staticfiles
        - media:/app/media
      depends_on:
        db:
            condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/task-manager/healthz/')" ]
        interval: 5s
        timeout: 5s
        retries: 5
    db:
      image: postgres:16
      env_file:
        - .env.docker
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: always
    celery:
      build: .
      command: celery -A core worker --loglevel=info
      env_file:
        - .env.docker
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
    redis:
      image: redis:7-alpine
      healthcheck:
        test: ["CMD","redis-cli","ping"]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: always
    nginx:
      image: nginx:alpine
      ports:
        - 80:80
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        - static:/app/staticfiles
        - media:/app/media
      depends_on:
        web:
          condition: service_healthy
volumes:
  pgdata:
  static:
  media: