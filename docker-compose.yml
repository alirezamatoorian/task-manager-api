

services:
    web:
      build: .
      ports:
        - 8000:8000
      env_file:
        - .env.docker
      depends_on:
        db:
            condition: service_healthy
    db:
      image: postgres:16
      ports:
        - 5432:5432
      env_file:
        - .env.docker
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL","pg_isready -U ${DB_USER}"]
        interval: 5s
        timeout: 5s
        retries: 5
volumes:
  pgdata:
