

services:
    web:
      build: .
      ports:
        - 8000:8000
      env_file:
        - .env.docker
      depends_on:
        - db
    db:
      image: postgres:16
      ports:
        - 5432:5432
      env_file:
        - .env.docker
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
