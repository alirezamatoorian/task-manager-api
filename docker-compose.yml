

services:
    web:
      build: .
      env_file:
        - .env.docker
      volumes:
        - static:/app/staticfiles
        - media:/app/media
      depends_on:
        db:
            condition: service_healthy
        redis:
          condition: service_started
    db:
      image: postgres:16
      env_file:
        - .env.docker
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 5
    celery:
      build: .
      command: celery -A core worker --loglevel=info
      env_file:
        - .env.docker
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
    redis:
      image: redis:7-alpine
    nginx:
      image: nginx:alpine
      ports:
        - 80:80
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        - static:/app/staticfiles
        - media:/app/media
      depends_on:
        - web
volumes:
  pgdata:
  static:
  media: